<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>网球记 — 我的网球日志</title>
<meta name="theme-color" content="#2e7d32">
<meta name="description" content="记录球拍参数（重量、磅数、挥重）与穿线提醒，记录每次打球的对手和时长，自动统计。">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="网球记">
<style>
  :root{
    --bg:#f7f7f4;
    --surface:#ffffff;
    --ink:#1f2421;
    --muted:#6b7269;
    --line:#e6e4dc;
    --accent:#2e7d32;        /* tennis green */
    --accent-soft:#e8f3e8;
    --ball:#c6ff3d;          /* tennis ball yellow-green */
    --warn:#b00020;
    --radius:14px;
    --shadow:0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.6;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 16px 96px;}

  header{
    position:sticky;top:0;z-index:10;
    background:rgba(247,247,244,.92);
    backdrop-filter:saturate(140%) blur(8px);
    border-bottom:1px solid var(--line);
  }
  .head-inner{
    max-width:760px;margin:0 auto;padding:12px 16px;
    display:flex;align-items:center;gap:10px;
  }
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:.5px;}
  .logo .ball{
    width:22px;height:22px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#dfff6a,var(--ball));
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);
    position:relative;
  }
  .logo .ball::after{
    content:"";position:absolute;inset:0;border-radius:50%;
    background:repeating-linear-gradient(115deg,transparent 0 3px,rgba(255,255,255,.75) 3px 4px);
    -webkit-mask:radial-gradient(circle at 50% 50%,#000 60%,transparent 61%);
            mask:radial-gradient(circle at 50% 50%,#000 60%,transparent 61%);
    opacity:.5;
  }
  .spacer{flex:1;}
  .icon-btn{
    border:1px solid var(--line);background:var(--surface);
    width:38px;height:38px;border-radius:10px;cursor:pointer;
    display:grid;place-items:center;color:var(--muted);
    transition:all .15s;
  }
  .icon-btn:hover{color:var(--ink);border-color:#cfcdba;}

  nav.tabs{display:flex;gap:4px;padding:8px 16px 0;max-width:760px;margin:0 auto;}
  .tab{
    flex:1;border:0;background:transparent;cursor:pointer;
    padding:10px 6px;font-size:15px;color:var(--muted);
    border-bottom:3px solid transparent;font-weight:600;
    transition:all .15s;
  }
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .tab:hover{color:var(--ink);}

  .section{display:none;}
  .section.active{display:block;animation:fade .2s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  .page-head{display:flex;align-items:baseline;justify-content:space-between;margin:20px 0 14px;gap:12px;flex-wrap:wrap;}
  .page-head h2{margin:0;font-size:22px;}
  .page-head .sub{color:var(--muted);font-size:14px;}

  button.primary{
    background:var(--accent);color:#fff;border:0;
    padding:10px 18px;border-radius:10px;font-size:15px;font-weight:600;
    cursor:pointer;transition:filter .15s,transform .05s;
    display:inline-flex;align-items:center;gap:7px;
  }
  button.primary:hover{filter:brightness(1.07);}
  button.primary:active{transform:translateY(1px);}
  button.ghost{
    background:transparent;border:1px solid var(--line);color:var(--ink);
    padding:9px 16px;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;
    transition:all .15s;
  }
  button.ghost:hover{background:#fff;border-color:#cfcdba;}

  /* Cards list */
  .card{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px;margin-bottom:12px;
  }
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .card-title{font-size:17px;font-weight:700;}
  .card-meta{color:var(--muted);font-size:13px;margin-top:2px;}
  .card-stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .pill{
    background:var(--accent-soft);color:#1b5e20;
    padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;
  }
  .pill.neutral{background:#f0efe9;color:#5d5648;}
  .pill.big{background:var(--ball);color:#1f2421;}
  .card-actions{display:flex;gap:6px;margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;}
  .card-actions button{flex:1;}
  .mini{
    border:1px solid var(--line);background:#fff;color:var(--muted);
    padding:8px 10px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:500;
    transition:all .12s;
  }
  .mini:hover{color:var(--ink);border-color:#cfcdba;}
  .mini.danger{color:var(--warn);border-color:#f3d4d9;}
  .mini.danger:hover{background:#fdf0f2;}

  .empty{
    text-align:center;padding:48px 20px;color:var(--muted);
    border:2px dashed var(--line);border-radius:var(--radius);background:#fff;
  }
  .empty .big{font-size:40px;margin-bottom:8px;}
  .empty p{margin:6px 0;}
  .empty button{margin-top:14px;}

  /* Modal/form */
  .scrim{
    position:fixed;inset:0;background:rgba(20,24,20,.42);
    display:none;align-items:flex-end;justify-content:center;z-index:50;
    padding:0;
  }
  .scrim.open{display:flex;animation:fade .15s ease;}
  .sheet{
    background:#fff;width:100%;max-width:560px;
    border-radius:18px 18px 0 0;padding:20px 20px 28px;
    max-height:92vh;overflow:auto;
    box-shadow:0 -8px 40px rgba(0,0,0,.2);
    animation:slide .22s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes slide{from{transform:translateY(40px);opacity:.6;}to{transform:none;opacity:1;}}
  .sheet h3{margin:0 0 4px;font-size:19px;}
  .sheet .hint{color:var(--muted);font-size:13px;margin:0 0 18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:600;color:#3d423d;margin-bottom:5px;}
  .field label .opt{color:var(--muted);font-weight:400;}
  .field input,.field select,.field textarea{
    width:100%;border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;font-size:15px;font-family:inherit;color:var(--ink);background:#fff;
    transition:border-color .15s,box-shadow .15s;
  }
  .field input:focus,.field select:focus,.field textarea:focus{
    outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
  }
  .field textarea{resize:vertical;min-height:64px;}
  .row{display:flex;gap:12px;}
  .row .field{flex:1;}
  .sheet-actions{display:flex;gap:10px;margin-top:8px;}
  .sheet-actions button{flex:1;}
  .sheet-actions .primary{padding:13px;}

  /* Stats */
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px;}
  .stat{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;box-shadow:var(--shadow);
  }
  .stat .n{font-size:28px;font-weight:800;letter-spacing:-.5px;}
  .stat .l{color:var(--muted);font-size:13px;margin-top:2px;}
  .stat .n .unit{font-size:14px;font-weight:600;color:var(--muted);margin-left:3px;}
  .stat.accent{background:linear-gradient(135deg,#2e7d32,#1b5e20);color:#fff;border-color:transparent;}
  .stat.accent .l{color:rgba(255,255,255,.8);}
  .stat.accent .n .unit{color:rgba(255,255,255,.75);}

  .recent h3{margin:24px 0 10px;font-size:16px;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .bar-row .name{width:90px;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar-track{flex:1;height:24px;background:#f0efe9;border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),#66bb6a);border-radius:6px;min-width:3px;transition:width .4s;}
  .bar-row .cnt{font-size:13px;color:var(--muted);width:28px;text-align:right;}

  /* FAB */
  .fab{
    position:fixed;right:18px;bottom:18px;z-index:20;
    width:58px;height:58px;border-radius:50%;border:0;cursor:pointer;
    background:var(--accent);color:#fff;font-size:30px;line-height:1;
    box-shadow:0 6px 20px rgba(46,125,50,.45);
    display:grid;place-items:center;transition:transform .15s,filter .15s;
  }
  .fab:hover{filter:brightness(1.08);transform:translateY(-2px);}
  .fab:active{transform:translateY(0);}

  .hint-line{color:var(--muted);font-size:13px;margin:8px 2px;}
  .search{
    width:100%;border:1px solid var(--line);border-radius:10px;
    padding:10px 12px 10px 38px;font-size:15px;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%236b7269' stroke-width='2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='m21 21-4.3-4.3'/></svg>") no-repeat 11px center;
    transition:border-color .15s,box-shadow .15s;
  }
  .search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}

  .toast{
    position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);
    background:#1f2421;color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;
    opacity:0;pointer-events:none;transition:all .25s;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.3);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .filter-bar{display:flex;gap:8px;margin:10px 0 0;flex-wrap:wrap;align-items:center;}
  .filter-bar select,.filter-bar input[type=month]{
    border:1px solid var(--line);border-radius:10px;background:#fff;
    padding:9px 10px;font-size:14px;font-family:inherit;color:var(--ink);
    transition:border-color .15s,box-shadow .15s;
  }
  .filter-bar select:focus,.filter-bar input[type=month]:focus{
    outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
  }
  .filter-bar .mini{padding:9px 14px;}

  .calendar{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-top:12px;}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-title{font-weight:700;font-size:16px;}
  .cal-nav{border:1px solid var(--line);background:#fff;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;line-height:1;color:var(--muted);transition:all .12s;}
  .cal-nav:hover{color:var(--ink);border-color:#cfcdba;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-wd{text-align:center;font-size:12px;color:var(--muted);padding:4px 0;font-weight:600;}
  .cal-day{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:14px;color:var(--ink);}
  .cal-day.has{background:var(--accent);color:#fff;font-weight:700;cursor:pointer;}
  .cal-day.has:hover{filter:brightness(1.12);}
  .cal-day.today{box-shadow:inset 0 0 0 2px var(--accent);}
  .cal-day.has.today{box-shadow:inset 0 0 0 2px rgba(255,255,255,.85);}
  .cal-day.sel{background:#1b5e20;}

  .banner{
    background:linear-gradient(135deg,#fff8e1,#fff3c4);
    border:1px solid #f0d97a;border-radius:var(--radius);
    padding:13px 15px;margin:14px 0 0;font-size:14px;
    display:flex;gap:10px;align-items:flex-start;
  }
  .banner .b-icon{font-size:20px;line-height:1.2;}
  .banner .b-body{flex:1;}
  .banner .b-title{font-weight:800;color:#7a5e00;}
  .banner .b-line{margin-top:3px;color:#6b5413;}
  .banner .b-body button{margin-top:8px;}

  @media(min-width:560px){
    .stat-grid{grid-template-columns:repeat(4,1fr);}
    .scrim{align-items:center;padding:20px;}
    .sheet{border-radius:18px;}
  }
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <div class="logo"><span class="ball"></span>网球记</div>
    <div class="spacer"></div>
    <button class="icon-btn" id="exportBtn" title="导出备份">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
    </button>
    <button class="icon-btn" id="importBtn" title="导入备份">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
    </button>
  </div>
  <nav class="tabs">
    <button class="tab active" data-tab="sessions">打球记录</button>
    <button class="tab" data-tab="gear">我的拍子</button>
    <button class="tab" data-tab="stats">统计</button>
  </nav>
</header>

<div class="wrap">

  <!-- Sessions -->
  <section class="section active" id="tab-sessions">
    <div id="restringBanner"></div>
    <div class="page-head">
      <div>
        <h2>打球记录</h2>
        <div class="sub" id="sessionCount">尚无记录</div>
      </div>
    </div>
    <input class="search" id="sessionSearch" placeholder="搜索对手或备注…">
    <div class="filter-bar">
      <select id="f_opponent" aria-label="筛选对手"></select>
      <input type="month" id="f_month" aria-label="筛选月份">
      <button class="mini" id="f_reset" type="button">重置</button>
    </div>
    <div class="calendar" id="calendarBox"></div>
    <div id="sessionList"></div>
  </section>

  <!-- Gear -->
  <section class="section" id="tab-gear">
    <div class="page-head">
      <div>
        <h2>我的拍子</h2>
        <div class="sub" id="gearCount">还没有添加球拍</div>
      </div>
      <button class="primary" onclick="openGear()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        添加球拍
      </button>
    </div>
    <div id="gearList"></div>
  </section>

  <!-- Stats -->
  <section class="section" id="tab-stats">
    <div class="page-head">
      <div><h2>统计</h2><div class="sub">你的网球生活一览</div></div>
    </div>
    <div class="stat-grid" id="statGrid"></div>
    <div class="recent">
      <h3>常一起打球的人</h3>
      <div id="opponentBars"></div>
    </div>
    <div class="recent">
      <h3>最近 10 次打球</h3>
      <div id="recentSessions"></div>
    </div>
  </section>

</div>

<button class="fab" id="fab" title="记一次打球">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<!-- Session modal -->
<div class="scrim" id="sessionScrim">
  <form class="sheet" id="sessionForm">
    <h3 id="sessionFormTitle">记一次打球</h3>
    <p class="hint">记录今天的对手和时长，留个网球回忆。</p>
    <input type="hidden" id="s_id">
    <div class="field">
      <label>日期</label>
      <input type="date" id="s_date" required>
    </div>
    <div class="row">
      <div class="field">
        <label>和谁打</label>
        <input type="text" id="s_opponent" placeholder="对手 / 球友" required list="opponentList">
        <datalist id="opponentList"></datalist>
      </div>
      <div class="field">
        <label>玩了多久（分钟）</label>
        <input type="number" id="s_duration" min="1" placeholder="如 90" required>
      </div>
    </div>
    <div class="field">
      <label>用了哪把拍子 <span class="opt">（可选）</span></label>
      <select id="s_racket"><option value="">不记录</option></select>
    </div>
    <div class="field">
      <label>备注 <span class="opt">（可选）</span></label>
      <textarea id="s_notes" placeholder="比分、场地、手感…"></textarea>
    </div>
    <div class="sheet-actions">
      <button type="button" class="ghost" onclick="closeScrim('sessionScrim')">取消</button>
      <button type="submit" class="primary">保存</button>
    </div>
  </form>
</div>

<!-- Gear modal -->
<div class="scrim" id="gearScrim">
  <form class="sheet" id="gearForm">
    <h3 id="gearFormTitle">添加球拍</h3>
    <p class="hint">记下拍子的参数，方便以后换线、对比手感。</p>
    <input type="hidden" id="g_id">
    <div class="field">
      <label>球拍名称</label>
      <input type="text" id="g_name" placeholder="如：Babolat Pure Aero" required>
    </div>
    <div class="row">
      <div class="field">
        <label>重量 (g)</label>
        <input type="number" id="g_weight" min="0" step="1" placeholder="300" inputmode="numeric">
      </div>
      <div class="field">
        <label>线磅数（横/竖）</label>
        <input type="text" id="g_tension" placeholder="如 46/48 或 55" inputmode="text">
      </div>
    </div>
    <div class="field">
      <label>挥重 <span class="opt">（kg·cm²）</span></label>
      <input type="number" id="g_swing" min="0" step="1" placeholder="320" inputmode="numeric">
    </div>
    <div class="row">
      <div class="field">
        <label>线型 <span class="opt">（可选）</span></label>
        <input type="text" id="g_string" placeholder="如：RPM Blast 1.25">
      </div>
      <div class="field">
        <label>穿线日期 <span class="opt">（可选）</span></label>
        <input type="date" id="g_strung">
      </div>
    </div>
    <div class="field">
      <label>备注 <span class="opt">（可选）</span></label>
      <textarea id="g_notes" placeholder="平衡点、手胶…"></textarea>
    </div>
    <div class="sheet-actions">
      <button type="button" class="ghost" onclick="closeScrim('gearScrim')">取消</button>
      <button type="submit" class="primary">保存</button>
    </div>
  </form>
</div>

<input type="file" id="fileInput" accept="application/json" style="display:none">
<div class="toast" id="toast"></div>

<script>
/* ---------- Storage ---------- */
const KEY = 'tennis_log_v1';
let store = { rackets:[], sessions:[] };

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ store = JSON.parse(raw); }
  }catch(e){ console.warn('读取失败', e); }
  if(!store.rackets) store.rackets = [];
  if(!store.sessions) store.sessions = [];
}
function save(){
  localStorage.setItem(KEY, JSON.stringify(store));
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ---------- Helpers ---------- */
function fmtDate(d){
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
}
function fmtDuration(min){
  if(!min) return '—';
  const h = Math.floor(min/60), m = min%60;
  if(h && m) return h+'小时'+m+'分';
  if(h) return h+'小时';
  return m+'分钟';
}
function racketName(id){
  const r = store.rackets.find(x=>x.id===id);
  return r ? r.name : '';
}
function goTab(t){ document.querySelector('.tab[data-tab="'+t+'"]').click(); }

/* 穿线提醒：已穿超过 45 天 或 累计打球超过 15 小时 → 建议换线 */
function stringingInfo(r){
  if(!r.strung) return null;
  const d = new Date(r.strung);
  if(isNaN(d)) return null;
  const days = Math.max(0, Math.floor((Date.now()-d.getTime())/86400000));
  const ss = store.sessions.filter(s=>s.racketId===r.id && s.date && s.date >= r.strung);
  const hours = ss.reduce((a,s)=>a+(+s.duration||0),0)/60;
  return { days, hours:+hours.toFixed(1), due: days>=45 || hours>=15 };
}
function restring(id){
  const r = store.rackets.find(x=>x.id===id);
  if(!r) return;
  if(!confirm('把「'+r.name+'」的穿线日期记为今天？\n（换上新线后点这个，会重新开始计时）')) return;
  r.strung = todayStr();
  save(); renderAll(); toast('已记录换线 🏸');
}
function renderRestringBanner(){
  const el = document.getElementById('restringBanner');
  if(!el) return;
  const due = store.rackets
    .map(r=>({r, info:stringingInfo(r)}))
    .filter(x=>x.info && x.info.due);
  if(!due.length){ el.innerHTML=''; return; }
  el.innerHTML = `<div class="banner">
    <div class="b-icon">🏸</div>
    <div class="b-body">
      <div class="b-title">该换线了</div>
      ${due.map(({r,info})=>`<div class="b-line">「${esc(r.name)}」已穿 ${info.days} 天 / 打了 ${info.hours} 小时</div>`).join('')}
      <button class="mini" type="button" onclick="goTab('gear')">去记录换线</button>
    </div>
  </div>`;
}

/* ---------- 月历：显示选中月哪些天打了球，点某天只看那天 ---------- */
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
let calDay = ''; // 当前点选的具体日期（yyyy-mm-dd），空=不按天筛选
function calMonth(){
  const v = document.getElementById('f_month').value;
  if(v) return v;
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function renderCalendar(){
  const box = document.getElementById('calendarBox');
  if(!box) return;
  const m = calMonth();
  const parts = m.split('-').map(Number);
  const y = parts[0], mo = parts[1];
  if(!y || !mo){ box.innerHTML=''; return; }
  const startWd = new Date(y, mo-1, 1).getDay();   // 0=周日
  const daysIn = new Date(y, mo, 0).getDate();
  const today = todayStr();
  const byDate = {};
  store.sessions.forEach(s=>{ if(s.date) byDate[s.date]=(byDate[s.date]||0)+1; });
  let cells = ['日','一','二','三','四','五','六'].map(w=>`<div class="cal-wd">${w}</div>`).join('');
  for(let i=0;i<startWd;i++) cells += `<div class="cal-day"></div>`;
  for(let d=1;d<=daysIn;d++){
    const ds = m+'-'+String(d).padStart(2,'0');
    const n = byDate[ds]||0;
    const cls = 'cal-day'+(n?' has':'')+(ds===today?' today':'')+(calDay===ds?' sel':'');
    cells += n
      ? `<div class="${cls}" title="${n} 次记录" onclick="pickDay('${ds}')">${d}</div>`
      : `<div class="${cls}">${d}</div>`;
  }
  const trailing = (7-(startWd+daysIn)%7)%7;
  for(let i=0;i<trailing;i++) cells += `<div class="cal-day"></div>`;
  box.innerHTML = `
    <div class="cal-head">
      <button class="cal-nav" type="button" onclick="calShift(-1)">‹</button>
      <div class="cal-title">${y}年${mo}月</div>
      <button class="cal-nav" type="button" onclick="calShift(1)">›</button>
    </div>
    <div class="cal-grid">${cells}</div>`;
}
function calShift(delta){
  const p = calMonth().split('-').map(Number);
  const d = new Date(p[0], p[1]-1+delta, 1);
  document.getElementById('f_month').value = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  calDay = '';
  renderCalendar(); renderSessions();
}
function pickDay(ds){
  calDay = (calDay===ds) ? '' : ds;
  renderCalendar(); renderSessions();
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'),1800);
}

/* ---------- Render: Sessions ---------- */
function renderSessions(){
  const list = document.getElementById('sessionList');
  // populate opponent filter, preserve current selection
  const sel = document.getElementById('f_opponent');
  const curOpp = sel.value;
  const opps = [...new Set(store.sessions.map(s=>s.opponent).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">全部对手</option>' + opps.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('');
  sel.value = curOpp;

  const q = (document.getElementById('sessionSearch').value||'').trim().toLowerCase();
  const fOpp = sel.value;
  const fMonth = document.getElementById('f_month').value;
  let arr = [...store.sessions].sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0));
  if(q){
    arr = arr.filter(s =>
      (s.opponent||'').toLowerCase().includes(q) ||
      (s.notes||'').toLowerCase().includes(q) ||
      (racketName(s.racketId)||'').toLowerCase().includes(q)
    );
  }
  if(fOpp) arr = arr.filter(s=>s.opponent===fOpp);
  if(fMonth) arr = arr.filter(s=>(s.date||'').slice(0,7)===fMonth);
  if(calDay) arr = arr.filter(s=>s.date===calDay);

  const total = store.sessions.length, shown = arr.length;
  document.getElementById('sessionCount').textContent =
    !total ? '尚无记录' : (shown<total ? `共 ${total} 次 · 当前 ${shown} 条` : `共 ${total} 次记录`);

  if(!arr.length){
    list.innerHTML = `<div class="empty"><div class="big">🎾</div>
      <p>${q?'没有匹配的记录':'还没有打球记录'}</p>
      <p>${q?'':'点右下角 + 记第一次吧'}</p>
      ${q?'':'<button class="primary" onclick="openSession()">记一次打球</button>'}
    </div>`;
    return;
  }
  list.innerHTML = arr.map(s=>{
    const rn = racketName(s.racketId);
    return `<div class="card">
      <div class="card-top">
        <div>
          <div class="card-title">${esc(s.opponent||'—')}</div>
          <div class="card-meta">${fmtDate(s.date)}</div>
        </div>
        <span class="pill big">${fmtDuration(s.duration)}</span>
      </div>
      <div class="card-stats">
        ${rn?`<span class="pill">🎾 ${esc(rn)}</span>`:''}
        ${s.notes?`<span class="pill neutral">📝 ${esc(s.notes).slice(0,40)}${s.notes.length>40?'…':''}</span>`:''}
      </div>
      <div class="card-actions">
        <button class="mini" onclick="openSession('${s.id}')">编辑</button>
        <button class="mini danger" onclick="delSession('${s.id}')">删除</button>
      </div>
    </div>`;
  }).join('');
}

/* ---------- Render: Gear ---------- */
function renderGear(){
  const list = document.getElementById('gearList');
  const arr = [...store.rackets].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  document.getElementById('gearCount').textContent = store.rackets.length
    ? `${store.rackets.length} 把球拍` : '还没有添加球拍';

  if(!arr.length){
    list.innerHTML = `<div class="empty"><div class="big">🏸</div>
      <p>还没有球拍</p><p>记下你的拍子参数吧</p>
      <button class="primary" onclick="openGear()">添加球拍</button>
    </div>`;
    return;
  }
  list.innerHTML = arr.map(r=>{
    const uses = store.sessions.filter(s=>s.racketId===r.id).length;
    const info = stringingInfo(r);
    return `<div class="card">
      <div class="card-top">
        <div>
          <div class="card-title">${esc(r.name)}</div>
          ${r.string?`<div class="card-meta">线：${esc(r.string)}</div>`:''}
        </div>
        ${uses?`<span class="pill neutral">打过 ${uses} 次</span>`:''}
      </div>
      <div class="card-stats">
        ${r.weight?`<span class="pill">⚖️ ${r.weight}g</span>`:''}
        ${r.tension?`<span class="pill">磅 ${esc(String(r.tension))}${String(r.tension).includes('/')?'（横/竖）':''}</span>`:''}
        ${r.swing?`<span class="pill">挥重 ${r.swing}</span>`:''}
      </div>
      ${info?`<div class="card-meta" style="margin-top:10px;">🏸 上次穿线 ${info.days} 天前 / 已打 ${info.hours} 小时${info.due?' · <span style="color:var(--warn);font-weight:700;">建议换线</span>':''}</div>`:''}
      ${r.notes?`<div class="card-meta" style="margin-top:8px;">${esc(r.notes)}</div>`:''}
      <div class="card-actions">
        <button class="mini" onclick="restring('${r.id}')">记录换线</button>
        <button class="mini" onclick="openGear('${r.id}')">编辑</button>
        <button class="mini danger" onclick="delGear('${r.id}')">删除</button>
      </div>
    </div>`;
  }).join('');
}

/* ---------- Render: Stats ---------- */
function renderStats(){
  const ss = store.sessions;
  const totalMin = ss.reduce((a,s)=>a+(+s.duration||0),0);
  // 不足 1 小时按分钟显示，避免 1 分钟被四舍五入成 "0.0小时" 看起来像没记上
  const fmtHours = (min)=> min<60 ? `${min}<span class="unit">分钟</span>` : `${(min/60).toFixed(1).replace(/\.0$/,'')}<span class="unit">小时</span>`;
  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const thisMonth = ss.filter(s=> new Date(s.date) >= monthStart);
  const monthMin = thisMonth.reduce((a,s)=>a+(+s.duration||0),0);

  // opponent counts
  const opp = {};
  ss.forEach(s=>{ const k=s.opponent||'—'; opp[k]=(opp[k]||0)+1; });
  const oppArr = Object.entries(opp).sort((a,b)=>b[1]-a[1]);
  const maxOpp = oppArr.length?oppArr[0][1]:1;

  const grid = document.getElementById('statGrid');
  grid.innerHTML = `
    <div class="stat accent">
      <div class="n">${ss.length}<span class="unit">次</span></div>
      <div class="l">总打球次数</div>
    </div>
    <div class="stat">
      <div class="n">${fmtHours(totalMin)}</div>
      <div class="l">累计时长</div>
    </div>
    <div class="stat">
      <div class="n">${thisMonth.length}<span class="unit">次</span></div>
      <div class="l">本月打球</div>
    </div>
    <div class="stat">
      <div class="n">${fmtHours(monthMin)}</div>
      <div class="l">本月时长</div>
    </div>`;

  const bars = document.getElementById('opponentBars');
  if(!oppArr.length){
    bars.innerHTML = `<p class="hint-line">还没有一起打球的记录。</p>`;
  }else{
    bars.innerHTML = oppArr.slice(0,6).map(([name,c])=>
      `<div class="bar-row">
        <div class="name" title="${esc(name)}">${esc(name)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(c/maxOpp*100).toFixed(1)}%"></div></div>
        <div class="cnt">${c}</div>
      </div>`).join('');
  }

  const recent = document.getElementById('recentSessions');
  const recentArr = [...ss].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,10);
  if(!recentArr.length){
    recent.innerHTML = `<p class="hint-line">暂无记录。</p>`;
  }else{
    recent.innerHTML = recentArr.map(s=>`<div class="bar-row">
      <div class="name" title="${esc(s.opponent||'')}">${esc(s.opponent||'—')}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,(s.duration/120*100)).toFixed(1)}%;background:linear-gradient(90deg,#c6ff3d,#9ccc65)"></div></div>
      <div class="cnt">${fmtDuration(s.duration)}</div>
    </div>`).join('');
  }
}

/* ---------- Session form ---------- */
function openSession(id){
  const f = document.getElementById('sessionForm');
  f.reset();
  document.getElementById('s_id').value = '';
  // racket options
  const sel = document.getElementById('s_racket');
  sel.innerHTML = '<option value="">不记录</option>' + store.rackets.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('');
  // opponent datalist
  const opps = [...new Set(store.sessions.map(s=>s.opponent).filter(Boolean))];
  document.getElementById('opponentList').innerHTML = opps.map(o=>`<option value="${esc(o)}">`).join('');

  if(id){
    const s = store.sessions.find(x=>x.id===id);
    if(s){
      document.getElementById('sessionFormTitle').textContent = '编辑打球记录';
      document.getElementById('s_id').value = s.id;
      document.getElementById('s_date').value = s.date||'';
      document.getElementById('s_opponent').value = s.opponent||'';
      document.getElementById('s_duration').value = s.duration||'';
      document.getElementById('s_racket').value = s.racketId||'';
      document.getElementById('s_notes').value = s.notes||'';
    }
  }else{
    document.getElementById('sessionFormTitle').textContent = '记一次打球';
    document.getElementById('s_date').value = todayStr();
  }
  openScrim('sessionScrim');
  setTimeout(()=>document.getElementById('s_opponent').focus(),120);
}
document.getElementById('sessionForm').addEventListener('submit',e=>{
  e.preventDefault();
  const id = document.getElementById('s_id').value;
  const obj = {
    id: id||uid(),
    date: document.getElementById('s_date').value,
    opponent: document.getElementById('s_opponent').value.trim(),
    duration: parseInt(document.getElementById('s_duration').value)||0,
    racketId: document.getElementById('s_racket').value,
    notes: document.getElementById('s_notes').value.trim(),
    createdAt: id ? (store.sessions.find(x=>x.id===id)||{}).createdAt||Date.now() : Date.now()
  };
  if(id){
    const i = store.sessions.findIndex(x=>x.id===id);
    store.sessions[i] = obj;
    toast('已更新记录');
  }else{
    store.sessions.push(obj);
    toast('记录已保存 🎾');
  }
  save(); closeScrim('sessionScrim'); renderAll();
});
function delSession(id){
  if(!confirm('删除这条打球记录？')) return;
  store.sessions = store.sessions.filter(x=>x.id!==id);
  save(); renderAll(); toast('已删除');
}

/* ---------- Gear form ---------- */
function openGear(id){
  const f = document.getElementById('gearForm');
  f.reset();
  document.getElementById('g_id').value = '';
  if(id){
    const r = store.rackets.find(x=>x.id===id);
    if(r){
      document.getElementById('gearFormTitle').textContent = '编辑球拍';
      document.getElementById('g_id').value = r.id;
      document.getElementById('g_name').value = r.name||'';
      document.getElementById('g_weight').value = r.weight||'';
      document.getElementById('g_tension').value = r.tension||'';
      document.getElementById('g_swing').value = r.swing||'';
      document.getElementById('g_string').value = r.string||'';
      document.getElementById('g_strung').value = r.strung||'';
      document.getElementById('g_notes').value = r.notes||'';
    }
  }else{
    document.getElementById('gearFormTitle').textContent = '添加球拍';
  }
  openScrim('gearScrim');
  setTimeout(()=>document.getElementById('g_name').focus(),120);
}
document.getElementById('gearForm').addEventListener('submit',e=>{
  e.preventDefault();
  const id = document.getElementById('g_id').value;
  const tensionRaw = document.getElementById('g_tension').value.trim().replace(/／/g,'/').replace(/\s+/g,'');
  if(tensionRaw && !/^\d+(\.\d+)?(\/\d+(\.\d+)?)?$/.test(tensionRaw)){
    alert('线磅数格式不对：填单个数字（如 55），或 横/竖 两个数字（如 46/48）');
    document.getElementById('g_tension').focus();
    return;
  }
  const obj = {
    id: id||uid(),
    name: document.getElementById('g_name').value.trim(),
    weight: parseInt(document.getElementById('g_weight').value)||null,
    tension: tensionRaw||null,
    swing: parseInt(document.getElementById('g_swing').value)||null,
    string: document.getElementById('g_string').value.trim(),
    strung: document.getElementById('g_strung').value||null,
    notes: document.getElementById('g_notes').value.trim(),
    createdAt: id ? (store.rackets.find(x=>x.id===id)||{}).createdAt||Date.now() : Date.now()
  };
  if(id){
    const i = store.rackets.findIndex(x=>x.id===id);
    store.rackets[i] = obj;
    toast('已更新球拍');
  }else{
    store.rackets.push(obj);
    toast('球拍已添加 🏸');
  }
  save(); closeScrim('gearScrim'); renderAll();
});
function delGear(id){
  const uses = store.sessions.filter(s=>s.racketId===id).length;
  const msg = uses ? `这把拍子关联了 ${uses} 条打球记录，删除后记录会保留但不再显示拍子。确定删除？` : '删除这把球拍？';
  if(!confirm(msg)) return;
  store.rackets = store.rackets.filter(x=>x.id!==id);
  save(); renderAll(); toast('已删除');
}

/* ---------- Tabs ---------- */
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
  });
});

/* ---------- FAB / scrim ---------- */
document.getElementById('fab').addEventListener('click',()=>openSession());
function openScrim(id){ document.getElementById(id).classList.add('open'); }
function closeScrim(id){ document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.scrim').forEach(s=>{
  s.addEventListener('click',e=>{ if(e.target===s) s.classList.remove('open'); });
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') document.querySelectorAll('.scrim.open').forEach(s=>s.classList.remove('open'));
});

/* ---------- Search ---------- */
document.getElementById('sessionSearch').addEventListener('input',renderSessions);
document.getElementById('f_opponent').addEventListener('change',renderSessions);
document.getElementById('f_month').addEventListener('input',()=>{ calDay=''; renderCalendar(); renderSessions(); });
document.getElementById('f_reset').addEventListener('click',()=>{
  document.getElementById('f_opponent').value='';
  document.getElementById('f_month').value='';
  document.getElementById('sessionSearch').value='';
  calDay='';
  renderCalendar(); renderSessions();
});

/* ---------- Export / Import ---------- */
document.getElementById('exportBtn').addEventListener('click',()=>{
  const data = JSON.stringify({...store, exportedAt:new Date().toISOString()},null,2);
  const blob = new Blob([data],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `网球记_备份_${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('已导出备份');
});
document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change',e=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(!data.rackets && !data.sessions) throw new Error('格式不对');
      if(!confirm('导入会合并到当前数据。确定继续？')) { e.target.value=''; return; }
      const existingR = new Map(store.rackets.map(r=>[r.id,r]));
      const existingS = new Map(store.sessions.map(s=>[s.id,s]));
      (data.rackets||[]).forEach(r=>{ if(r.id) existingR.set(r.id, r); });
      (data.sessions||[]).forEach(s=>{ if(s.id) existingS.set(s.id, s); });
      store.rackets = [...existingR.values()];
      store.sessions = [...existingS.values()];
      save(); renderAll();
      toast('导入成功');
    }catch(err){
      toast('导入失败：文件格式不对');
      alert('导入失败：'+err.message);
    }
    e.target.value='';
  };
  reader.readAsText(file);
});

/* ---------- utils ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- boot ---------- */
function renderAll(){ renderRestringBanner(); renderCalendar(); renderSessions(); renderGear(); renderStats(); }
load(); renderAll();

/* PWA：注册 service worker，实现离线可用（需 https 或 localhost 才生效） */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
